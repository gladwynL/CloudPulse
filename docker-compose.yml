# CloudPulse local development stack.
#
#   cp .env.example .env      # then set POSTGRES_PASSWORD
#   docker compose up --build
#
# Frontend: http://localhost:3000   API: http://localhost:8000/docs   Postgres: localhost:5432
#
# All published ports bind to 127.0.0.1 only. The API has no authentication in this phase;
# do not expose it to an untrusted network.
#
# Optional demo monitoring target (a local nginx the worker is allowed to reach):
#   MONITORING_ALLOWED_LOCAL_HOSTS=demo-target:8080 docker compose --profile demo up --build

# Production-style local run (only the frontend published, read-only containers, capabilities
# dropped, API docs off): add the hardened override.
#   docker compose -f docker-compose.yml -f docker-compose.hardened.yml up --build -d --wait

name: cloudpulse

# Docker's default json-file logs are unbounded; cap them so a long-running stack cannot fill a disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudpulse}
      POSTGRES_USER: ${POSTGRES_USER:-cloudpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging

  # One-shot job that applies Alembic migrations before the API and worker start.
  # migrate, backend and worker all run the same image (built once, by `backend`).
  migrate:
    image: cloudpulse-backend:local
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-cloudpulse}
      POSTGRES_USER: ${POSTGRES_USER:-cloudpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      MONITORING_MIN_INTERVAL_SECONDS: ${MONITORING_MIN_INTERVAL_SECONDS:-10}
      MONITORING_MAX_INTERVAL_SECONDS: ${MONITORING_MAX_INTERVAL_SECONDS:-86400}
      MONITORING_DEFAULT_INTERVAL_SECONDS: ${MONITORING_DEFAULT_INTERVAL_SECONDS:-60}
      MONITORING_DEFAULT_TIMEOUT_SECONDS: ${MONITORING_DEFAULT_TIMEOUT_SECONDS:-10}
      MONITORING_MAX_TIMEOUT_SECONDS: ${MONITORING_MAX_TIMEOUT_SECONDS:-30}
      MONITORING_LEASE_GRACE_SECONDS: ${MONITORING_LEASE_GRACE_SECONDS:-30}
      MONITORING_ALLOWED_LOCAL_HOSTS: ${MONITORING_ALLOWED_LOCAL_HOSTS:-}
      MONITORING_POLL_INTERVAL_SECONDS: ${MONITORING_POLL_INTERVAL_SECONDS:-2}
      MONITORING_MAX_CONCURRENT_CHECKS: ${MONITORING_MAX_CONCURRENT_CHECKS:-10}
      MONITORING_SHUTDOWN_GRACE_SECONDS: ${MONITORING_SHUTDOWN_GRACE_SECONDS:-20}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-30}
      METRICS_CLEANUP_INTERVAL_HOURS: ${METRICS_CLEANUP_INTERVAL_HOURS:-24}
      METRICS_CLEANUP_BATCH_SIZE: ${METRICS_CLEANUP_BATCH_SIZE:-1000}
      METRICS_MAX_QUERY_DAYS: ${METRICS_MAX_QUERY_DAYS:-30}
      METRICS_DEFAULT_WINDOW_HOURS: ${METRICS_DEFAULT_WINDOW_HOURS:-24}
      METRICS_MAX_TIMESERIES_BUCKETS: ${METRICS_MAX_TIMESERIES_BUCKETS:-1000}
      METRICS_DEFAULT_PAGE_SIZE: ${METRICS_DEFAULT_PAGE_SIZE:-50}
      METRICS_MAX_PAGE_SIZE: ${METRICS_MAX_PAGE_SIZE:-200}
      ALERTING_MAX_RULES_PER_RESOURCE: ${ALERTING_MAX_RULES_PER_RESOURCE:-20}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  backend:
    build:
      context: ./backend
    image: cloudpulse-backend:local
    restart: unless-stopped
    environment: *backend-env
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *default-logging

  # Runs the polling scheduler. Exactly one worker is supported; the API never polls.
  worker:
    image: cloudpulse-backend:local
    pull_policy: never
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment: *backend-env
    # Longer than MONITORING_SHUTDOWN_GRACE_SECONDS so in-flight checks can finish on stop.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_APP_ENV: ${ENVIRONMENT:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  # Demo-only target for trying out monitoring locally (profile "demo").
  # GET /  -> 200 (healthy)    GET /missing -> 404 (degraded when 200 is expected)
  # `docker compose stop demo-target` makes monitored URLs go DOWN.
  demo-target:
    profiles: ["demo"]
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *default-logging

volumes:
  postgres-data:
