[project]
name = "cloudpulse-api"
version = "0.1.0"
description = "CloudPulse monitoring and observability API"
requires-python = ">=3.12,<3.13"
readme = "../README.md"

# Dependencies are pinned in requirements.txt / requirements-dev.txt.
# This file holds project metadata and tool configuration.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Migrations embed long generated SQL strings (constraint expressions).
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are intentionally used as defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:app.*",
    # Upstream Starlette notice about its TestClient transport; not actionable here yet.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
