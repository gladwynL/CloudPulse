# Shared by the API proxy locations in nginx.conf.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Pass a caller-supplied request id through; the API generates one otherwise.
proxy_set_header X-Request-ID $http_x_request_id;
# A manual check performs the HTTP request inside the API call (up to 30 s timeout + overhead).
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
