server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Nothing in the dashboard uploads data; requests are small JSON bodies.
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Scripts and styles come only from this origin (the build has no inline scripts; the chart
    # library sets inline style attributes, hence 'unsafe-inline' for styles only). The dev stack
    # also calls the API directly on localhost:8000; the hardened stack uses the proxy below
    # and never needs that.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Docker's embedded DNS. Resolving per request (via a variable below) means the proxy keeps
    # working when the backend container is recreated and gets a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Reverse proxy to the API over the internal network. Only these paths are forwarded;
    # nothing else of the backend is reachable through this entry point.
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        include /etc/nginx/cloudpulse-proxy.conf;
    }
    location = /health {
        set $backend http://backend:8000;
        proxy_pass $backend;
        include /etc/nginx/cloudpulse-proxy.conf;
    }
    location = /ready {
        set $backend http://backend:8000;
        proxy_pass $backend;
        include /etc/nginx/cloudpulse-proxy.conf;
    }

    # The API's interactive docs are not part of this entry point (and are disabled in the hardened
    # stack). Answer plainly instead of letting the SPA fallback return HTML for them.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # Fingerprinted build assets can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header in a location replaces inherited ones, so repeat the security headers.
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app fallback.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
