name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrate, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cloudpulse_ci
          POSTGRES_USER: cloudpulse
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudpulse -d cloudpulse_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      # Throwaway credentials for the ephemeral CI service container only.
      DATABASE_URL: postgresql+psycopg://cloudpulse:ci-only-password@127.0.0.1:5432/cloudpulse_ci
      TEST_DATABASE_URL: postgresql+psycopg://cloudpulse:ci-only-password@127.0.0.1:5432/cloudpulse_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check migrations match models
        run: alembic check

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend (lint, format, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Vitest
        run: npm test

      - name: Production build
        run: npm run build

  docker:
    name: Docker stack (build, run, smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15
    env:
      # Throwaway values for an ephemeral CI stack; nothing here is a real secret.
      POSTGRES_PASSWORD: ci-only-password
      MONITORING_ALLOWED_LOCAL_HOSTS: demo-target:8080
      MONITORING_MIN_INTERVAL_SECONDS: "5"
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose --profile demo config --quiet

      - name: Build and start the stack (with demo target)
        run: docker compose --profile demo up --build --detach --wait --wait-timeout 180

      - name: Show service status
        run: docker compose --profile demo ps --all

      - name: End-to-end smoke test
        run: python scripts/smoke_test.py

      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile demo logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose --profile demo down --volumes
