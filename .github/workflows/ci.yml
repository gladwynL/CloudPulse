name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, audit, migrate, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cloudpulse_ci
          POSTGRES_USER: cloudpulse
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudpulse -d cloudpulse_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      # Throwaway credentials for the ephemeral CI service container only.
      DATABASE_URL: postgresql+psycopg://cloudpulse:ci-only-password@127.0.0.1:5432/cloudpulse_ci
      TEST_DATABASE_URL: postgresql+psycopg://cloudpulse:ci-only-password@127.0.0.1:5432/cloudpulse_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      # Known-vulnerability scan of the pinned runtime dependencies (open-source tool, free).
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off

      - name: Ruff format check
        run: ruff format --check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check migrations match models
        run: alembic check

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend (lint, audit, format, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      # Shipped dependencies only; fails on high or critical advisories.
      - name: Dependency audit (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Prettier check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Production build
        run: npm run build

  docker:
    name: Docker stack (build, run, smoke test, browser E2E)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    env:
      # Throwaway values for an ephemeral CI stack; nothing here is a real secret.
      POSTGRES_PASSWORD: ci-only-password
      MONITORING_ALLOWED_LOCAL_HOSTS: demo-target:8080
      MONITORING_MIN_INTERVAL_SECONDS: "5"
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose files (development and hardened)
        run: |
          docker compose --profile demo config --quiet
          docker compose -f docker-compose.yml -f docker-compose.hardened.yml --profile demo config --quiet

      - name: Build and start the stack (with demo target)
        run: docker compose --profile demo up --build --detach --wait --wait-timeout 180

      - name: Show service status
        run: docker compose --profile demo ps --all

      - name: End-to-end smoke test
        run: python scripts/smoke_test.py --docker-control

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and the test browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Drives the real dashboard in a browser against this stack. The tests only create,
      # change and delete resources they named themselves (e2e-...).
      - name: Browser end-to-end tests
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 3

      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile demo logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose --profile demo down --volumes

  # The production-style local deployment: only the frontend is published, the API is reached through
  # its nginx proxy, containers are read-only with capabilities dropped. Runs in parallel with the
  # development-stack job above.
  docker-hardened:
    name: Hardened stack (ports, smoke test, backup and restore, browser E2E)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.hardened.yml
      COMPOSE_PATH_SEPARATOR: ":"
      MONITORING_ALLOWED_LOCAL_HOSTS: demo-target:8080
      MONITORING_MIN_INTERVAL_SECONDS: "5"
      # The stack is reached only through nginx; the API shares its origin.
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Also exercises the documented first-run path: a generated password, never a committed one.
      - name: Create .env with a generated password
        run: |
          python scripts/init_env.py
          python scripts/init_env.py --check

      - name: Build and start the hardened stack
        run: docker compose --profile demo up --build --detach --wait --wait-timeout 240

      - name: Only the frontend may publish a port, on loopback
        run: python scripts/check_ports.py --only frontend

      - name: Smoke test through the proxy
        run: python scripts/smoke_test.py --api http://localhost:3000 --docker-control

      - name: Back up the database and verify it in a disposable container
        run: |
          python scripts/db_backup.py backup --output-dir "$RUNNER_TEMP/backups"
          python scripts/db_backup.py verify "$RUNNER_TEMP/backups"/*.dump

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and the test browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser end-to-end tests against the hardened stack
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-hardened-test-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 3

      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile demo logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose --profile demo down --volumes
